<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Workflow: idea, prompt, build, ship"><title>Workflow: idea, prompt, build, ship</title><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style><defs><clipPath id="rr"><rect width="1200" height="230" rx="20"/></clipPath><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#fff" fill-opacity=".07"/></pattern><radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="0" stop-color="#06060b" stop-opacity="0"/><stop offset="1" stop-color="#06060b" stop-opacity=".9"/></radialGradient><linearGradient id="ag" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#ff4fa3"/><stop offset="1" stop-color="#ffb35c"/></linearGradient><linearGradient id="hl" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7c5cff" stop-opacity="0"/><stop offset=".28" stop-color="#7c5cff"/><stop offset=".58" stop-color="#ff4fa3"/><stop offset=".82" stop-color="#ffb35c"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></linearGradient><radialGradient id="bl1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.3"/><stop offset=".55" stop-color="#7c5cff" stop-opacity="0.100"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient><radialGradient id="bl2"><stop offset="0" stop-color="#ff4fa3" stop-opacity="0.22"/><stop offset=".55" stop-color="#ff4fa3" stop-opacity="0.073"/><stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/></radialGradient><radialGradient id="halo"><stop offset="0" stop-color="#ff8cc6" stop-opacity=".9"/><stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="230" rx="20" fill="#0a0a10"/><g clip-path="url(#rr)"><ellipse cx="180" cy="40" rx="42