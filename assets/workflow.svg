<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Workflow: idea, prompt, build, ship"><title>Workflow: idea, prompt, build, ship</title><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style><defs><clipPath id="rr"><rect width="1200" height="230" rx="18"/></clipPath><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#2a2a2a"/></pattern><radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".92"/></radialGradient><linearGradient id="hl" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="230" rx="18" fill="#000"/><g clip-path="url(#rr)"><rect width="1200" height="230" fill="url(#dots)"/><rect width="1200" height="230" fill="url(#vig)"/><rect width="1200" height="230" fill="url(#cg)"/></g><rect x=".5" y=".5" width="1199" height="229" rx="18" fill="none" stroke="#1f1f1f"/><rect x="150" y="78" width="900" height="1" fill="#2b2b2b"/><circle cx="150" cy="78" r="28" fill="none" stroke="#fff" opacity="0"><animate attributeName="r" values="28;28;46;46" keyTimes="0;0.020;0.120;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0;0" keyTimes="0;0.020;0.120;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="150" cy="78" r="28" fill="#000" stroke="#fff" stroke-width="1.5"/><text class="m" x="150" y="83" font-size="15" fill="#fff" text-anchor="middle" letter-spacing="1">01</text><text class="s" x="150" y="160" font-size="17" font-weight="700" letter-spacing="7" fill="#fff" text-anchor="middle">IDEA</text><text class="s" x="150" y="186" font-size="14.5" fill="#8a8a8a" text-anchor="middle">Start with a real problem.</text><circle cx="450" cy="78" r="28" fill="none" stroke="#fff" opacity="0"><animate attributeName="r" values="28;28;46;46" keyTimes="0;0.303;0.403;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0;0" keyTimes="0;0.303;0.403;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="450" cy="78" r="28" fill="#000" stroke="#fff" stroke-width="1.5"/><text class="m" x="450" y="83" font-size="15" fill="#fff" text-anchor="middle" letter-spacing="1">02</text><text class="s" x="450" y="160" font-size="17" font-weight="700" letter-spacing="7" fill="#fff" text-anchor="middle">PROMPT</text><text class="s" x="450" y="186" font-size="14.5" fill="#8a8a8a" text-anchor="middle">Direct the AI with clarity.</text><circle cx="750" cy="78" r="28" fill="none" stroke="#fff" opacity="0"><animate attributeName="r" values="28;28;46;46" keyTimes="0;0.587;0.687;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0;0" keyTimes="0;0.587;0.687;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="750" cy="78" r="28" fill="#000" stroke="#fff" stroke-width="1.5"/><text class="m" x="750" y="83" font-size="15" fill="#fff" text-anchor="middle" letter-spacing="1">03</text><text class="s" x="750" y="160" font-size="17" font-weight="700" letter-spacing="7" fill="#fff" text-anchor="middle">BUILD</text><text class="s" x="750" y="186" font-size="14.5" fill="#8a8a8a" text-anchor="middle">AI does the heavy lifting.</text><circle cx="1050" cy="78" r="28" fill="none" stroke="#fff" opacity="0"><animate attributeName="r" values="28;28;46;46" keyTimes="0;0.870;0.970;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0;0" keyTimes="0;0.870;0.970;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="1050" cy="78" r="28" fill="#000" stroke="#fff" stroke-width="1.5"/><text class="m" x="1050" y="83" font-size="15" fill="#fff" text-anchor="middle" letter-spacing="1">04</text><text class="s" x="1050" y="160" font-size="17" font-weight="700" letter-spacing="7" fill="#fff" text-anchor="middle">SHIP</text><text class="s" x="1050" y="186" font-size="14.5" fill="#8a8a8a" text-anchor="middle">Launch, learn, iterate.</text><circle r="4" fill="#fff"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.87;1" calcMode="linear" path="M150 78H1050"/></circle></svg>