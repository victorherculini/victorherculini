ame="r" values="28;28;48;48" keyTimes="0;0.587;0.687;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0;0" keyTimes="0;0.587;0.687;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="750" cy="78" r="28" fill="#06060b" stroke="url(#ag)" stroke-width="1.8"/><text class="m" x="750" y="83" font-size="15" fill="#fff" text-anchor="middle" letter-spacing="1">03</text><text class="s" x="750" y="160" font-size="17" font-weight="700" letter-spacing="7" fill="#fff" text-anchor="middle">BUILD</text><text class="s" x="750" y="186" font-size="14.5" fill="#8b8ba3" text-anchor="middle">AI does the heavy lifting.</text><circle cx="1050" cy="78" r="28" fill="none" stroke="url(#ag)" stroke-width="1.5" opacity="0"><animate attributeName="r" values="28;28;48;48" keyTimes="0;0.870;0.970;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0;0" keyTimes="0;0.870;0.970;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="1050" cy="78" r="28" fill="#06060b" stroke="url(#ag)" stroke-width="1.8"/><text class="m" x="1050" y="83" font-size="15" fill="#fff" text-anchor="middle" letter-spacing="1">04</text><text class="s" x="1050" y="160" font-size="17" font-weight="700" letter-spacing="7" fill="#fff" text-anchor="middle">SHIP</text><text class="s" x="1050" y="186" font-size="14.5" fill="#8b8ba3" text-anchor="middle">Launch, learn, iterate.</text><circle r="16" fill="url(#halo)"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.87;1" calcMode="linear" path="M150 78H1050"/></circle><circle r="3.6" fill="#fff"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.87;1" calcMode="linear" path="M150 78H1050"/></circle></svg>